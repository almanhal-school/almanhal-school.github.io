<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="description" content="بوابة مدرسة المنهل الابتدائية للبنين لمتابعة درجات الطلبة">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>بوابة المنهل</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: narrow centered app column, navy masthead band, cards only for portal choices and the report */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --fg:#14213d; --muted:#5b6b86; --line:#dde3ee;
  --navy:#1e3c72; --navy-ink:#ffffff; --gold:#c8962e; --soft:#e8eef8;
  --good:#1f7a4d; --good-bg:#e3f4ea; --warn:#9a6200; --warn-bg:#fdf1db; --bad:#b3261e; --bad-bg:#fbe5e3;
  --display:"Tajawal",system-ui,sans-serif; --body:"IBM Plex Sans Arabic","Tajawal",system-ui,sans-serif;
  --fs:16px; --ink:#1e3c72;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1626; --surface:#16213a; --fg:#e8edf7; --muted:#9aa8c4; --line:#2a3858;
  --navy:#2b4f8f; --navy-ink:#ffffff; --gold:#e0b04f; --soft:#1d2b4a;
  --good:#6fd39d; --good-bg:#183a2a; --warn:#f0c065; --warn-bg:#3a2e14; --bad:#f2a49c; --bad-bg:#3d1d1a; --ink:#bcd2ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1626; --surface:#16213a; --fg:#e8edf7; --muted:#9aa8c4; --line:#2a3858;
  --navy:#2b4f8f; --navy-ink:#ffffff; --gold:#e0b04f; --soft:#1d2b4a;
  --good:#6fd39d; --good-bg:#183a2a; --warn:#f0c065; --warn-bg:#3a2e14; --bad:#f2a49c; --bad-bg:#3d1d1a; --ink:#bcd2ff; color-scheme:dark}
html{font-size:var(--fs)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:1rem;line-height:1.7}
*{box-sizing:border-box}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.mast{background:var(--navy);color:var(--navy-ink)}
header.mast .wrap{display:flex;align-items:center;gap:14px;padding-block:14px;flex-wrap:wrap}
.logo{width:56px;height:56px;border-radius:50%;background:#fff;padding:4px;flex:none}
.brand{flex:1;min-width:0}
.brand b{font-family:var(--display);font-size:1.5rem;font-weight:800;display:block;line-height:1.2}
.brand span{font-size:.9rem;opacity:.85}
.sizer{display:flex;gap:4px;align-items:center;font-size:.85rem}
.sizer button{background:transparent;color:var(--navy-ink);border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:2px 10px;cursor:pointer;font:inherit}
.sizer button[aria-pressed="true"]{background:var(--navy-ink);color:var(--navy)}
main{padding-block:28px 40px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.3;margin:0}
h1{font-size:1.9rem;font-weight:800}
h2{font-size:1.35rem;font-weight:700}
.lead{color:var(--muted);margin:.4rem 0 0}
.demo{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.88rem;margin-bottom:20px}
.portals{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:24px}
.portal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:10px}
.portal .ic{width:44px;height:44px;border-radius:10px;background:var(--soft);color:var(--ink);display:grid;place-items:center}
.portal p{margin:0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--navy);color:var(--navy-ink);border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.sizer button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.portal .btn{align-self:flex-start;margin-top:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{background:var(--soft);border-radius:999px;padding:4px 12px;font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
.login{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
label{font-weight:600;font-size:.95rem}
.hint{font-size:.82rem;color:var(--muted)}
input,select,textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.field{display:flex;flex-direction:column;gap:4px}
.err{color:var(--bad);background:var(--bad-bg);border-radius:8px;padding:8px 12px;font-size:.9rem}
.ok{color:var(--good);background:var(--good-bg);border-radius:8px;padding:8px 12px;font-size:.9rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.student{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kv{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kv small{display:block;color:var(--muted);font-size:.8rem}
.kv b{font-family:var(--display);font-size:1.2rem;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;font:inherit;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--gold);font-weight:700}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:560px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
th{font-size:.82rem;color:var(--muted);font-weight:600;background:var(--soft)}
tr:last-child td{border-bottom:0}
td.num{text-align:center}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.82rem;font-weight:600}
.p-good{background:var(--good-bg);color:var(--good)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)}
.mcards{display:none}.mc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}.mh{display:flex;align-items:center;gap:10px;margin-bottom:8px}.mh>b{flex:1}.mg{white-space:nowrap}.mn{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);line-height:1.7;font-size:.95em;color:var(--muted)}
@media (max-width:700px){.tbl.gt{display:none}.mcards{display:block}}
.prbar{margin-top:16px;display:flex;justify-content:flex-start}.prbar .btn{display:inline-flex;align-items:center;gap:8px}
.prtools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}.prhint{margin-bottom:14px}
.sheetwrap{overflow-x:auto}
.sheet{width:210mm;min-height:296mm;box-sizing:border-box;margin:0 auto;padding:14mm 14mm 12mm;background:#fff;color:#14213d;font-family:inherit;display:flex;flex-direction:column;box-shadow:0 2px 14px rgba(0,0,0,.25)}
.sh-head{display:flex;align-items:center;gap:14px;border-bottom:3px solid #1e3c72;padding-bottom:10px}.sh-head img{width:70px;height:auto}
.sh-k{font-size:13px;color:#5b6b86}.sh-s{font-size:20px;font-weight:700;color:#1e3c72}
.sh-t{text-align:center;font-size:19px;margin:12px 0 2px;color:#1e3c72}.sh-sub{text-align:center;color:#5b6b86;font-size:14px;margin-bottom:10px}
.sheet table{width:100%;border-collapse:collapse;min-width:0}.sh-info td,.sh-sum td{border:1px solid #c9d2e3;padding:6px 12px}.sh-info span,.sh-sum span{display:block;font-size:12px;color:#5b6b86}.sh-info b,.sh-sum b{font-size:16px}
.sh-g{margin:10px 0}.sh-g th{background:#1e3c72;color:#fff;padding:8px;font-size:14px;border:1px solid #1e3c72}.sh-g td{border:1px solid #c9d2e3;padding:5px 9px;font-size:12.5px;line-height:1.5;vertical-align:middle}.sh-g tr:nth-child(even) td{background:#f3f6fb}.sh-g .sb{font-weight:700;white-space:nowrap}.sh-g .c{text-align:center;white-space:nowrap}
.sh-sum td{background:#eef2f9}
.sh-sig{display:flex;justify-content:space-between;gap:40px;margin-top:auto;padding-top:16px;font-size:14px}.sh-sig div{flex:1}.sh-sig i{display:block;border-bottom:1px solid #8a97ad;height:34px}
.sh-foot{display:flex;justify-content:space-between;margin-top:18px;padding-top:8px;border-top:1px solid #c9d2e3;font-size:12px;color:#5b6b86}
@page{size:A4;margin:0}
@media print{.sh-sig{margin-top:24px!important}body{background:#fff!important}header,footer,.prtools,.prhint{display:none!important}main.wrap{padding:0!important;margin:0!important;max-width:none!important}.view{padding:0!important;margin:0!important}.sheetwrap{overflow:visible}.sheet{box-shadow:none;margin:0;display:block;min-height:0;height:auto;padding:10mm 14mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.smsg{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid #c9a227;border-radius:12px;padding:14px 16px;margin:4px 0 18px;line-height:1.8}@media (max-width:700px){.tabs{display:grid;grid-template-columns:1fr 1fr;overflow:visible}.tabs button{text-align:center}}
.smb{font-size:.92em;color:var(--muted);margin-bottom:6px}.smh{font-weight:700;margin-bottom:4px;color:#c9a227}
.sh-msg{margin-top:10px;border:1px solid #c9d2e3;border-inline-start:4px solid #c9a227;padding:10px 14px;font-size:14px;line-height:1.8;background:#fffbea}.sh-msg b{display:block;color:#8a6d00;margin-bottom:2px}
.star{color:#e0a800;margin-inline-start:6px;font-size:1.15em}
.sh-hdr{flex:none;width:182mm;height:29.5mm;max-width:none;display:block;padding-bottom:8px;border-bottom:3px solid #1e3c72}
.sh-pr{position:relative}.sh-stamp{display:block;width:22mm;height:22mm;max-width:none;margin:1mm auto -2mm;transform:rotate(-12deg);opacity:.9}
.sh-staff{display:flex;justify-content:space-between;gap:16px;margin-top:14px;padding-top:10px;border-top:2px solid #1e3c72;text-align:center;font-size:13px}.sh-staff span{display:block;color:#5b6b86;margin-bottom:3px}.sh-staff b{font-weight:600}.sh-date{text-align:center;font-size:11px;color:#8a97ad;margin-top:10px}
.tnote{min-width:180px;max-width:340px;font-size:.92em;line-height:1.6;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ink)}
.note{background:var(--soft);border-radius:10px;padding:12px 14px;margin-top:10px}
.note small{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.row .field{flex:1;min-width:160px}
td input{width:70px;padding:6px;text-align:center}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.82rem;text-align:center;padding-block:18px}
@media (prefers-reduced-motion:no-preference){.view{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>

async function findStudent(cpr){
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(cpr),"PBKDF2",false,["deriveBits"]);
 const dk=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(SALT),iterations:ITER},km,384));
 const id=[...dk.slice(0,8)].map(b=>b.toString(16).padStart(2,"0")).join(""), blob=ENC[id]; if(!blob)return null;
 const raw=b64(blob), key=await crypto.subtle.importKey("raw",dk.slice(16,48),"AES-GCM",false,["decrypt"]);
 try{const r=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:raw.slice(0,12)},key,raw.slice(12))));
  const g={},notes=[];(r.v||[]).forEach(([x,n],i)=>{g[SUBJ[i]]=x;if(n)notes.push({t:SUBJ[i],d:"الوقفة الأولى",x:n})});return {cpr,name:r.s,cls:r.c,q:r.q,absent:0,late:0,g,notes,st:r.st||[]}}catch(e){return null}}

 [95,"تميّز استثنائي",["إدارة المدرسة تفخر بإنجازك المتميز، فقد كنت قدوة لزملائك في الاجتهاد والتفوق. نتمنى لك دوام التألق والنجاح.","أداء رائع يستحق التقدير والثناء، شكرًا لك على جهدك المتواصل، وشكرًا لأسرتك الكريمة على متابعتها واهتمامها.","نبارك لك هذا المستوى المشرّف، ونتطلع إلى مزيد من التفوق والإبداع في الفترات القادمة."]],

 [75,"جيد جدًا",["أداء جيد جدًا، ولديك القدرة على الوصول إلى مستويات أعلى بالمثابرة والمراجعة المستمرة.","نشكر لك جهدك، ونشجعك على تنظيم وقتك ومراجعة دروسك يوميًا لتحقيق نتائج أفضل.","مستواك مبشّر، ومع متابعة الأسرة وتعاون المعلمين ستحقق تقدمًا واضحًا بإذن الله."]],
 [60,"جيد",["نقدّر جهدك، ونحتاج منك مزيدًا من التركيز والاهتمام بالواجبات والمراجعة اليومية لرفع مستواك.","يمكنك تحقيق الأفضل، نوصي بالتواصل مع المعلمين ومتابعة الأسرة المستمرة لتحسين النتائج.","بداية يمكن البناء عليها، نثق بقدرتك على التقدم، والمدرسة إلى جانبك لدعمك."]],
 [0,"يحتاج إلى دعم",["نأمل من ولي الأمر الكريم التواصل مع المدرسة لوضع خطة دعم مشتركة تساعد الطالب على تحسين مستواه.","نثق بقدرات ابنكم، ونحتاج إلى تعاون الأسرة والمدرسة معًا لمتابعته ورفع مستواه في الفترة القادمة.","المدرسة ترحب بزيارتكم ومناقشة احتياجات الطالب، فالتعاون بيننا هو مفتاح نجاحه."]]];

function report(tab="grades"){const s=DB.students.find(x=>x.cpr===session.cpr);
 const done=SUBJ.filter(k=>typeof s.g[k]==="number"), sum=done.reduce((a,k)=>a+s.g[k],0), avg=done.length?Math.round(sum/done.length*5):null;
 const fmt=x=>String(+x.toFixed(2));
 const rows=SUBJ.map(k=>{const x=s.g[k],n=s.notes.find(o=>o.t===k);if(typeof x!=="number")return`<tr><td>${k}</td><td class="num">—</td><td></td><td><span class="pill" style="background:var(--soft)">لم تُرصد بعد</span></td><td></td></tr>`;const[gl,gc]=grade(x*5);return`<tr><td>${k}</td><td class="num"><b>${fmt(x)}</b> / 20</td><td><div class="bar"><i style="width:${x*5}%"></i></div></td><td><span class="pill ${gc}">${gl}</span></td><td class="tnote">${n?esc(n.x)+`${s.st.includes(k)?'<span class="star" title="طالب متميز">★</span>':""}`:"—"}</td></tr>`}).join("");
 const cards=SUBJ.map(k=>{const x=s.g[k],n=s.notes.find(o=>o.t===k);if(typeof x!=="number")return`<div class="mc"><div class="mh"><b>${k}</b><span class="pill" style="background:var(--soft)">لم تُرصد بعد</span></div></div>`;const[gl,gc]=grade(x*5);return`<div class="mc"><div class="mh"><b>${k}</b><span class="mg"><b>${fmt(x)}</b> / 20</span><span class="pill ${gc}">${gl}</span></div><div class="bar"><i style="width:${x*5}%"></i></div>${n?`<div class="mn">${esc(n.x)}${s.st.includes(k)?'<span class="star" title="طالب متميز">★</span>':""}</div>`:""}</div>`}).join("");
 const ex=DB.excuses.filter(e=>e.cpr===s.cpr).map(e=>`<div class="note"><small>${esc(e.date)} · ${e.status}</small><div>${esc(e.text)}</div></div>`).join("");
 let body="";
 if(tab==="grades")body=`<h2 style="margin:4px 0 10px">اختبار الوقفة الأولى</h2>${done.length?`<p class="lead" style="margin-bottom:10px">المجموع ${fmt(sum)} من ${done.length*20}</p>`:""}<div class="mcards">${cards}</div><div class="tbl gt"><table><thead><tr><th>المادة</th><th>الدرجة</th><th></th><th>التقدير</th><th>ملاحظات المعلم</th></tr></thead><tbody>${rows}</tbody></table></div><div class="prbar"><button class="btn" id="prt"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg> طباعة التقرير / PDF</button></div>`;
 if(tab==="att")body=`<div class="student"><div class="kv"><small>أيام الغياب</small><b>${s.absent}</b></div><div class="kv"><small>مرات التأخير</small><b>${s.late}</b></div></div>
  <form class="card" id="xf" style="display:flex;flex-direction:column;gap:12px"><h2>تقديم عذر غياب</h2>
  <div class="row"><div class="field"><label for="xd">تاريخ الغياب</label><input id="xd" type="date" required></div></div>
  <div class="field"><label for="xt">سبب الغياب</label><textarea id="xt" rows="3" required placeholder="مثال: موعد في المستشفى"></textarea></div>
  <button class="btn" type="submit" style="align-self:flex-start">إرسال العذر</button><div id="xmsg"></div></form>${ex?'<h2 style="margin-top:20px">الأعذار المرسلة</h2>'+ex:''}`;
 if(tab==="notes")body=s.notes.length?s.notes.map(n=>`<div class="note"><small>${n.t} · ${n.d}</small><div>${esc(n.x)}</div></div>`).join(""):'<p class="lead">ما في ملاحظات من المعلمين حالياً.</p>';
 app.innerHTML=`<div class="view"><div class="top"><div><h1>${s.name}</h1><p class="lead">الفصل الدراسي الأول 2026–2027 · الوقفة الأولى</p></div><button class="btn ghost" id="out">خروج</button></div>
 <div class="student"><div class="kv"><small>الصف</small><b>${s.cls}</b></div><div class="kv"><small>المعدل العام</small><b>${avg===null?"—":avg+"%"}</b></div><div class="kv"><small>التقدير العام</small><b>${avg===null?'<span class="pill" style="background:var(--soft)">لم تُرصد بعد</span>':`<span class="pill ${grade(avg)[1]}">${grade(avg)[0]}</span>`}</b></div><div class="kv"><small>أيام الغياب</small><b>${s.absent}</b></div></div>
 ${(m=>m?`<div class="smsg"><div class="smh">رسالة من إدارة المدرسة</div><div class="smb">التصنيف: <b>${m.band}</b> · المعدل العام <bdi dir="ltr">${avg}%</bdi></div><div>${m.text}</div></div>`:"")(schoolMsg(avg,s.q))}<div class="tabs" role="tablist"><button role="tab" id="t-grades" aria-selected="${tab==='grades'}">الدرجات</button><button role="tab" id="t-att" aria-selected="${tab==='att'}">الحضور والأعذار</button><button role="tab" id="t-notes" aria-selected="${tab==='notes'}">ملاحظات المعلمين</button></div>${body}</div>`;
 $("#out").onclick=()=>{session=null;location.hash="";route()};
 ["grades","att","notes"].forEach(t=>$("#t-"+t).onclick=()=>report(t));
 if(tab==="grades")$("#prt").onclick=()=>printView(s);
 if(tab==="att")$("#xf").onsubmit=e=>{e.preventDefault();DB.excuses.push({cpr:s.cpr,name:s.name,date:$("#xd").value,text:$("#xt").value,status:"بانتظار المراجعة"});report("att");$("#xmsg").innerHTML='<div class="ok">تم إرسال العذر، وبتشوفه المعلمة في بوابتها.</div>'}}

function printView(s){const fmt=x=>String(+x.toFixed(2)),done=SUBJ.filter(k=>typeof s.g[k]==="number"),sum=done.reduce((a,k)=>a+s.g[k],0),avg=done.length?Math.round(sum/done.length*5):null;
 const rows=SUBJ.map(k=>{const x=s.g[k],n=s.notes.find(o=>o.t===k);return`<tr><td class="sb">${k}</td><td class="c">${typeof x==="number"?`<b>${fmt(x)}</b> / 20`:"—"}</td><td class="c">${typeof x==="number"?grade(x*5)[0]:"لم تُرصد بعد"}</td><td>${n?esc(n.x).replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]\uFE0F?/gu,"").trim()+`${s.st.includes(k)?'<span class="star" title="طالب متميز">★</span>':""}`:""}</td></tr>`}).join("");
 const logo=document.querySelector("img.logo").src, today=new Date().toLocaleDateString("ar-BH-u-nu-latn",{year:"numeric",month:"long",day:"numeric"});
 app.innerHTML=`<div class="view"><div class="prtools"><button class="btn ghost" id="pback">رجوع</button><button class="btn" id="pgo">طباعة</button><button class="btn" id="ppdf">تحميل PDF</button></div><p class="lead prhint">لحفظ التقرير كملف PDF اضغط "تحميل PDF"، أو اضغط "طباعة" واختر "حفظ كـ PDF".</p>
 <div class="sheetwrap"><div class="sheet" id="sheet"><img class="sh-hdr" src="img/print-header.png" alt="ترويسة المدرسة">
 <h2 class="sh-t">تقرير أداء الطالب – اختبار الوقفة الأولى</h2><div class="sh-sub">الفصل الدراسي الأول 2026–2027</div>
 <table class="sh-info"><tr><td><span>اسم الطالب</span><b>${esc(s.name)}</b></td><td><span>الصف</span><b>${esc(s.cls)}</b></td></tr></table>
 <table class="sh-g"><thead><tr><th>المادة</th><th>الدرجة</th><th>التقدير</th><th>ملاحظات المعلم</th></tr></thead><tbody>${rows}</tbody></table>
 <table class="sh-sum"><tr><td><span>المجموع</span><b>${done.length?fmt(sum)+" من "+done.length*20:"—"}</b></td><td><span>المعدل العام</span><b>${avg===null?"—":avg+"%"}</b></td><td><span>التقدير العام</span><b>${avg===null?"—":grade(avg)[0]}</b></td></tr></table>
 ${(m=>m?`<div class="sh-msg"><b>رسالة من إدارة المدرسة <span style="font-weight:400;color:#5b6b86">· التصنيف: ${m.band}</span></b><div>${m.text}</div></div>`:"")(schoolMsg(avg,s.q))}<div class="sh-sig"><div>توقيع ولي الأمر<i></i></div><div class="sh-blank"></div></div>
 <div class="sh-staff"><div><span>إعداد</span><b>أ.سارة حسن طرادة</b></div><div><span>المديرات المساعدات</span><b>أ.نادية العماري – أ.عبير ميرزا – أ.فتحية الحلواجي</b></div><div class="sh-pr"><span>مديرة المدرسة</span><b>أ.فاطمة يوسف سعود</b><img class="sh-stamp" src="img/stamp.png" alt="ختم المدرسة"></div></div><div class="sh-date">تاريخ الطباعة: ${today}</div></div></div></div>`;
 $("#pback").onclick=()=>report("grades");$("#pgo").onclick=()=>window.print();
 $("#ppdf").onclick=async()=>{const b=$("#ppdf");b.disabled=true;b.textContent="جاري التجهيز...";
  try{if(!window.html2pdf)await new Promise((ok,no)=>{const sc=document.createElement("script");sc.src="vendor/html2pdf.bundle.min.js";sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
   const host=document.createElement("div");host.style.cssText="position:fixed;left:0;top:0;z-index:-1;opacity:1;pointer-events:none";const cl=$("#sheet").cloneNode(true);cl.removeAttribute("id");cl.style.boxShadow="none";cl.style.margin="0";host.appendChild(cl);document.body.appendChild(host);
   const tw=document.createTreeWalker(cl,NodeFilter.SHOW_TEXT),tn=[];while(tw.nextNode())if(tw.currentNode.nodeValue.trim())tn.push(tw.currentNode);
   tn.forEach(t=>{const f=document.createDocumentFragment();t.nodeValue.split(/(\s+|[،.,:؛!؟]+(?=\s|$))/).forEach(w=>{if(!w)return;if(/^\s+$/.test(w))f.appendChild(document.createTextNode(" "));else{const sp=document.createElement("span");sp.style.display="inline-block";sp.textContent=w;f.appendChild(sp)}});t.parentNode.replaceChild(f,t)});
   window.scrollTo(0,0);
   try{await html2pdf().set({margin:0,filename:"تقرير "+s.name+".pdf",image:{type:"jpeg",quality:0.95},html2canvas:{scale:2,backgroundColor:"#ffffff",scrollX:0,scrollY:0,logging:false},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:"avoid-all"}}).from(cl).save()}finally{host.remove()}}
  catch(e){alert("ما قدرنا نجهز الملف، جرّب زر الطباعة واختر حفظ كـ PDF.")}
  b.disabled=false;b.textContent="تحميل PDF"}}
